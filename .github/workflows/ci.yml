name: CI

on:
  push:
  pull_request:

# Cancel superseded runs for the same branch/PR.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Format, lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      # CI uses its OWN disposable PostgreSQL, not Neon, so CI needs no database
      # secrets. It exists only for the duration of this job. Local development
      # uses Neon (see docs/architecture/decisions/0003-switch-database-to-neon.md).
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: merostay_ci
          POSTGRES_PASSWORD: merostay_ci_password
          POSTGRES_DB: merostay_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U merostay_ci -d merostay_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Throwaway credentials for the CI-only container above. Not a secret.
      # Integration tests use ONLY TEST_DATABASE_URL; they wipe it and apply all
      # migrations on every run (apps/api/src/testing/global-setup.ts).
      TEST_DATABASE_URL: postgresql://merostay_ci:merostay_ci_password@localhost:5432/merostay_ci
      API_URL: http://localhost:4000
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Integration tests (migrations, constraints, seed on PostgreSQL)
        run: npm run test:integration

      - name: Production build
        run: npm run build

  e2e:
    # Gap 21: the Playwright journeys (customer, partner, admin; desktop + mobile) on every push
    # and pull request, against production builds of the API and web app and a throwaway
    # PostgreSQL. No secrets: nothing here reaches Neon. Runs in parallel with `verify`.
    name: E2E journeys (Playwright, disposable database)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: merostay_ci
          POSTGRES_PASSWORD: merostay_ci_password
          POSTGRES_DB: merostay_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U merostay_ci -d merostay_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Throwaway credentials for the CI-only container above. Not a secret. Playwright's global
      # setup applies all migrations here and seeds the test world (apps/api/src/testing/e2e-world.ts).
      E2E_DATABASE_URL: postgresql://merostay_ci:merostay_ci_password@localhost:5432/merostay_e2e
      # Next.js bakes the /api/v1 rewrite target in at build time (ADR 0010): the E2E API's port
      # (playwright.config.ts). The same value is used by the build and by the running servers.
      API_URL: http://localhost:4100
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium and its system libraries
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Chromium's system libraries (browser from cache)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Production build (API + web, API_URL baked in)
        run: npm run build

      - name: E2E journeys (desktop + mobile Chromium)
        # CI=true (set by Actions): servers are never reused, one retry records a trace, and a
        # flaky pass still fails the run (failOnFlakyTests). Any failure fails this job.
        run: npx playwright test

      - name: Upload Playwright report and traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: ignore
